# Railway service configuration.
#
# Three services run this same image with different start commands:
#
#   web     -> startCommand = "/app/docker-entrypoint.sh web"
#   worker  -> startCommand = "/app/docker-entrypoint.sh worker"
#   beat    -> startCommand = "/app/docker-entrypoint.sh beat"   (exactly 1 replica)
#
# Migrations are wired to preDeployCommand so they run once per deploy, before
# the new container takes traffic. Doing it in the start command instead would
# run them in every replica at once.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/docker-entrypoint.sh web"
# Must match the app's health route. A failing healthcheck stops the rollout
# instead of sending traffic to a broken release.
healthcheckPath = "/health"
healthcheckTimeout = 120
# Migrations run once per deploy, before the new container takes traffic.
# The entrypoint ALSO runs them when the schema is missing entirely, so a first
# deploy cannot come up against an empty database even if this is not honoured.
preDeployCommand = "/app/docker-entrypoint.sh release"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# NOTE: replica counts are intentionally not set here. Railway's config schema
# does not accept a `replicas` key under [deploy.resources]; an invalid file can
# cause the whole railway.toml to be ignored, which would silently drop
# preDeployCommand. Set replica counts in the dashboard instead (and keep `beat`
# at exactly 1).
