{% extends "layouts/app.html" %}

{% block page_title %}{{ 'Edit department' if mode == 'edit' else 'New department' }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl">
  <form method="post"
        action="{{ url_for('views.department_edit', department_id=department.id) if mode == 'edit' else url_for('views.department_new') }}"
        class="space-y-6 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">

    <div>
      <label class="block text-sm font-medium text-slate-700">Department name *</label>
      <input name="name" required value="{{ form.name or '' }}" placeholder="Engineering"
             class="mt-1 block w-full rounded-lg border-0 py-2 px-3 text-sm ring-1 ring-inset ring-slate-300 focus:ring-2 focus:ring-brand-600">
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700">Code *</label>
      <input name="code" required value="{{ form.code or '' }}" placeholder="ENG" maxlength="20"
             class="mt-1 block w-full rounded-lg border-0 py-2 px-3 text-sm uppercase ring-1 ring-inset ring-slate-300 focus:ring-2 focus:ring-brand-600">
      <p class="mt-1 text-xs text-slate-500">A short unique identifier, shown throughout the app.</p>
    </div>

    <div class="flex justify-end gap-3 border-t border-slate-100 pt-4">
      <a href="{{ url_for('views.departments') }}"
         class="rounded-lg px-4 py-2 text-sm font-semibold text-slate-700 ring-1 ring-inset ring-slate-300 hover:bg-slate-50">Cancel</a>
      <button type="submit"
              class="rounded-lg bg-brand-600 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-500">
        {{ 'Save changes' if mode == 'edit' else 'Create department' }}
      </button>
    </div>
  </form>
</div>
{% endblock %}
