{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block body %}
<div class="flex min-h-full items-center justify-center px-6 py-24">
  <div class="w-full max-w-lg rounded-2xl bg-white p-8 text-center shadow-sm ring-1 ring-slate-200">
    <p class="text-sm font-semibold text-brand-600">{{ code }}</p>
    <h1 class="mt-2 text-2xl font-bold tracking-tight text-slate-900">{{ title }}</h1>
    <p class="mt-3 text-sm text-slate-600">{{ message }}</p>

    {% if detail %}
      <pre class="mt-4 overflow-x-auto rounded-lg bg-slate-900 p-3 text-left text-xs text-slate-100">{{ detail }}</pre>
    {% endif %}

    <div class="mt-6 flex justify-center gap-3">
      <a href="{{ url_for('views.dashboard') }}"
         class="rounded-lg bg-brand-600 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-500">
        Back to dashboard
      </a>
      <a href="{{ url_for('views.login') }}"
         class="rounded-lg px-4 py-2 text-sm font-semibold text-slate-700 ring-1 ring-inset ring-slate-300 hover:bg-slate-50">
        Sign in
      </a>
    </div>
  </div>
</div>
{% endblock %}
